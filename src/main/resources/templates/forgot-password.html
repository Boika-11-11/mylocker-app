<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password - HopeConnect</title>
    <link rel="stylesheet" th:href="@{/css/locker.css}">
</head>
<body class="auth-page">

<div class="auth-box">

    <div class="auth-logo">
        <svg class="logo-mark" viewBox="0 0 64 64">
            <rect x="6" y="20" width="52" height="38" rx="7" fill="#F72585"/>
            <path d="M18 20v-4a14 14 0 0 1 28 0v4h-8v-4a6 6 0 0 0-12 0v4z" fill="#fff"/>
            <circle cx="32" cy="36" r="5" fill="#fff"/>
            <rect x="30" y="39" width="4" height="9" rx="2" fill="#fff"/>
        </svg>
        <span class="logo-text">Hope<span>Connect</span></span>
    </div>

    <div th:if="${sent}">
        <h1>Check your email</h1>
        <p class="sub">
            If an account exists for that address, we have sent a link to reset the password.
            The link expires in 30 minutes.
        </p>
        <p class="auth-foot">
            <a th:href="@{/login}">Back to sign in</a>
        </p>
    </div>

    <div th:unless="${sent}">
        <h1>Forgot your password?</h1>
        <p class="sub">Enter your email address and we will send you a reset link.</p>

        <form th:action="@{/forgot-password}" method="post">

            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>

            <button type="submit" class="block">Send reset link</button>

        </form>

        <p class="auth-foot">
            Remembered it? <a th:href="@{/login}">Sign in</a>
        </p>
    </div>

</div>

</body>
</html>
