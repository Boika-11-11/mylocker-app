<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - HopeConnect</title>
    <link rel="stylesheet" th:href="@{/css/locker.css}">
</head>
<body class="auth-page">

<div class="auth-box">

    <div class="auth-logo">
        <svg class="logo-mark" viewBox="0 0 64 64">
            <rect x="6" y="20" width="52" height="38" rx="7" fill="#F72585"/>
            <path d="M18 20v-4a14 14 0 0 1 28 0v4h-8v-4a6 6 0 0 0-12 0v4z" fill="#fff"/>
            <circle cx="32" cy="36" r="5" fill="#fff"/>
            <rect x="30" y="39" width="4" height="9" rx="2" fill="#fff"/>
        </svg>
        <span class="logo-text">Hope<span>Connect</span></span>
    </div>

    <h1>Sign in</h1>
    <p class="sub">Enter your details to open your account.</p>

    <p class="msg-err" th:if="${param.error}">Invalid credentials.</p>
    <p class="msg-ok" th:if="${param.logout}">You have been signed out.</p>
    <p class="msg-ok" th:if="${param.registered}">
        Account created. An admin must approve it before you can sign in.
    </p>

    <form th:action="@{/login}" method="post">

        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="block">Sign in</button>

    </form>

    <p class="auth-foot">
        No account? <a th:href="@{/signup}">Create one</a>
    </p>

</div>

</body>
</html>
