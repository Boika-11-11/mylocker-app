<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - HopeConnect</title>
    <link rel="stylesheet" th:href="@{/css/locker.css}">
</head>
<body class="auth-page">

<div class="auth-box">

    <div class="auth-logo">
        <svg class="logo-mark" viewBox="0 0 64 64">
            <rect x="6" y="20" width="52" height="38" rx="7" fill="#A8185A"/>
            <path d="M18 20v-4a14 14 0 0 1 28 0v4h-8v-4a6 6 0 0 0-12 0v4z" fill="#fff"/>
            <circle cx="32" cy="36" r="5" fill="#fff"/>
            <rect x="30" y="39" width="4" height="9" rx="2" fill="#fff"/>
        </svg>
        <span class="logo-text">Hope<span>Connect</span></span>
    </div>

    <h1>Sign in</h1>
    <p class="sub">Enter your email and password.</p>

    <p class="msg-err" th:if="${param.error}">Invalid credentials.</p>
    <p class="msg-ok" th:if="${param.logout}">You have been signed out.</p>
    <p class="msg-ok" th:if="${param.reset}">Password changed. You can sign in now.</p>

    <form th:action="@{/login}" method="post">

        <div class="field">
            <label for="username">Email address</label>
            <input type="email" id="username" name="username" required autofocus>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
                <input type="password" id="password" name="password" required>
                <button type="button" class="pw-toggle" data-target="password"
                        aria-label="Show password" aria-pressed="false">
                    <svg class="icon-show" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="icon-hide" viewBox="0 0 24 24">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                        <path d="M1 1l22 22"/>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="block">Sign in</button>

    </form>

    <p class="auth-foot">
        <a th:href="@{/forgot-password}">Forgot your password?</a>
    </p>

    <p class="auth-foot">
        Access is by invitation. <a th:href="@{/request-access}">Request access</a>
    </p>

    <p class="auth-foot">
        <a th:href="@{/}">Back to home</a>
    </p>

</div>

<script th:src="@{/js/password-toggle.js}"></script>

</body>
</html>
