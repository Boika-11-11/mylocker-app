<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password - HopeConnect</title>
    <link rel="stylesheet" th:href="@{/css/locker.css}">
</head>
<body class="auth-page">

<div class="auth-box">

    <div class="auth-logo">
        <svg class="logo-mark" viewBox="0 0 64 64">
            <rect x="6" y="20" width="52" height="38" rx="7" fill="#F72585"/>
            <path d="M18 20v-4a14 14 0 0 1 28 0v4h-8v-4a6 6 0 0 0-12 0v4z" fill="#fff"/>
            <circle cx="32" cy="36" r="5" fill="#fff"/>
            <rect x="30" y="39" width="4" height="9" rx="2" fill="#fff"/>
        </svg>
        <span class="logo-text">Hope<span>Connect</span></span>
    </div>

    <div th:if="${invalid}">
        <h1>Link expired</h1>
        <p class="sub">
            This reset link is no longer valid. Links expire after 30 minutes
            and can only be used once.
        </p>
        <p class="auth-foot">
            <a th:href="@{/forgot-password}">Request a new link</a>
        </p>
    </div>

    <div th:unless="${invalid}">
        <h1>Choose a new password</h1>
        <p class="sub">Pick something you have not used before.</p>

        <p class="msg-err" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/reset-password}" method="post">

            <input type="hidden" name="token" th:value="${token}">

            <div class="field">
                <label for="password">New password</label>
                <input type="password" id="password" name="password"
                       required minlength="8" autofocus>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       required minlength="8">
            </div>

            <p class="hint" style="margin-bottom:16px;">At least 8 characters.</p>

            <button type="submit" class="block">Save new password</button>

        </form>
    </div>

</div>

</body>
</html>
