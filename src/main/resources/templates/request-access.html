<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request access - HopeConnect</title>
    <link rel="stylesheet" th:href="@{/css/locker.css}">
</head>
<body class="auth-page">

<div class="auth-box">

    <div class="auth-logo">
        <svg class="logo-mark" viewBox="0 0 64 64">
            <rect x="6" y="20" width="52" height="38" rx="7" fill="#A8185A"/>
            <path d="M18 20v-4a14 14 0 0 1 28 0v4h-8v-4a6 6 0 0 0-12 0v4z" fill="#fff"/>
            <circle cx="32" cy="36" r="5" fill="#fff"/>
            <rect x="30" y="39" width="4" height="9" rx="2" fill="#fff"/>
        </svg>
        <span class="logo-text">Hope<span>Connect</span></span>
    </div>

    <div th:if="${sent}">
        <h1>Request received</h1>
        <p class="sub">
            Thanks. If your request is approved you will receive an email
            with a link to set your password.
        </p>
        <p class="auth-foot">
            <a th:href="@{/}">Back to home</a>
        </p>
    </div>

    <div th:unless="${sent}">
        <h1>Request access</h1>
        <p class="sub">Access is by invitation. Tell me who you are and I will be in touch.</p>

        <p class="msg-err" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/request-access}" method="post">

            <div style="position:absolute;left:-9999px;" aria-hidden="true">
                <label for="website">Leave this empty</label>
                <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
            </div>

            <div class="field">
                <label for="name">Your name</label>
                <input type="text" id="name" name="name"
                       th:value="${name}" required maxlength="30">
            </div>

            <div class="field">
                <label for="email">Your email</label>
                <input type="email" id="email" name="email"
                       th:value="${email}" required maxlength="100">
            </div>

            <div class="field">
                <label for="reason">Why do you need access?</label>
                <textarea id="reason" name="reason" rows="4" maxlength="500"></textarea>
            </div>

            <button type="submit" class="block">Send request</button>

        </form>

        <p class="auth-foot">
            Already have an account? <a th:href="@{/login}">Sign in</a>
        </p>
    </div>

</div>

</body>
</html>
