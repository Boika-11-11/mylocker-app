<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account - MyLocker</title>
    <link rel="stylesheet" th:href="@{/css/locker.css}">
</head>
<body class="auth-page">

<div class="auth-box">

    <div class="auth-logo">
        <svg class="logo-mark" viewBox="0 0 64 64">
            <rect x="6" y="20" width="52" height="38" rx="7" fill="#F72585"/>
            <path d="M18 20v-4a14 14 0 0 1 28 0v4h-8v-4a6 6 0 0 0-12 0v4z" fill="#fff"/>
            <circle cx="32" cy="36" r="5" fill="#fff"/>
            <rect x="30" y="39" width="4" height="9" rx="2" fill="#fff"/>
        </svg>
        <span class="logo-text">My<span>Locker</span></span>
    </div>

    <h1>Create an account</h1>
    <p class="sub">An admin will approve your account before you can sign in.</p>

    <p class="msg-err" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/signup}" method="post">

        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   th:value="${username}" required maxlength="30" autofocus>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8">
        </div>

        <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   required minlength="8">
        </div>

        <p class="hint" style="margin-bottom:16px;">
            At least 8 characters. Letters, numbers, dot, dash and underscore only in usernames.
        </p>

        <button type="submit" class="block">Create account</button>

    </form>

    <p class="auth-foot">
        Already registered? <a th:href="@{/login}">Sign in</a>
    </p>

</div>

</body>
</html>
